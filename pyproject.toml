[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-automation-pipeline"
version = "3.1.0"
description = "Seven-skill, multi-channel YouTube production pipeline"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3", "PyYAML>=6,<7", "httpx>=0.27,<1", "Pillow>=10.4,<13", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
youtube-pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["pipeline*", "skills*", "web*"]
exclude = ["web.node_modules*"]

[tool.setuptools.package-data]
skills = ["*/SKILL.md"]
web = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
